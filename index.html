<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your To Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Mono:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Your To Do</h1>

    <div class="add-row">
      <input type="text" id="add-input" placeholder="Add new task" maxlength="200">
      <button class="add-btn" id="add-btn" aria-label="Add task">+</button>
    </div>

    <div class="task-list" id="task-list">
      <!-- populated by loadTodos() in script.js -->
    </div>
    

    <div class="footer">
      <div class="remaining" id="remaining-text">Your remaining todos : 0</div>
      <div class="quote" id="quote">"Doing what you love is the cornerstone of having abundance in your life." — Wayne Dyer</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
